<div class="app-shell">
  <div class="ambient ambient-left" aria-hidden="true"></div>
  <div class="ambient ambient-right" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand-wrap">
      <span class="brand-mark" aria-hidden="true">PF</span>
      <div>
        <div class="brand">{{ appName }}</div>
        <small class="brand-subtitle">Previsao e controle financeiro inteligente</small>
      </div>
    </div>

    <nav class="menu" aria-label="Navegacao principal">
      @for (item of menu; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="menu-link"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </header>

  <main class="content" [class.route-pulse]="routePulse">
    <router-outlet (activate)="onRouteActivated()"></router-outlet>
  </main>
</div>
