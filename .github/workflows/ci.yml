name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'fase/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend:
    name: Backend Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/backend/PrevFinance.slnx

      - name: Build
        run: dotnet build src/backend/PrevFinance.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/backend/PrevFinance.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend Lint Build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend/prevfinance-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/prevfinance-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
